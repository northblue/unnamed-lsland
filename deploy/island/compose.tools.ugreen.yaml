# Optional temporary UGREEN project: inspect status, then explicitly deploy migrations.
version: '3.8'
services:
  tools:
    image: ghcr.io/northblue/unnamed-island@sha256:b46d667fb07c88b0e209b549b03ccc8755feb445be0d6a8bb9cd1286cf7985a6
    platform: linux/amd64
    restart: 'no'
    environment:
      DATABASE_URL: ''
    command: [node, scripts/postgres-cli.mjs, status]
    networks:
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  data:
    external: true
    name: nas-postgres-data
