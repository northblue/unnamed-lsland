# Optional temporary UGREEN project: inspect status, then explicitly deploy migrations.
version: '3.8'
services:
  tools:
    image: ghcr.io/northblue/unnamed-island@sha256:7d565f891032725e725e9bb2293891948f99d91bb0a235c0741bc7b8571d1fe6
    platform: linux/amd64
    restart: 'no'
    environment:
      DATABASE_URL: ''
    command: [node, scripts/postgres-cli.mjs, status]
    networks:
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  data:
    external: true
    name: nas-postgres-data
