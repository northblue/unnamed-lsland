# Optional temporary UGREEN project: inspect status, then explicitly deploy migrations.
version: '3.8'
services:
  tools:
    image: ghcr.io/northblue/unnamed-island@sha256:9386c9969b491a258369a38fb27a9791c1d806b40d7b68b1b7a19081ed99bee1
    platform: linux/amd64
    restart: 'no'
    environment:
      DATABASE_URL: ''
    command: [node, scripts/postgres-cli.mjs, status]
    networks:
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  data:
    external: true
    name: nas-postgres-data
