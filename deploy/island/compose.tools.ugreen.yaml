# Optional temporary UGREEN project: inspect status, then explicitly deploy migrations.
version: '3.8'
services:
  tools:
    image: ghcr.io/northblue/unnamed-island@sha256:966968623c9ee514a82346b98934a3129d1d374315725090264d271e4ad348a8
    platform: linux/amd64
    restart: 'no'
    environment:
      DATABASE_URL: ''
    command: [node, scripts/postgres-cli.mjs, status]
    networks:
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  data:
    external: true
    name: nas-postgres-data
