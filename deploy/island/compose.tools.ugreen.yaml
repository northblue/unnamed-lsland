# Optional temporary UGREEN project: inspect status, then explicitly deploy migrations.
version: '3.8'
services:
  tools:
    image: ghcr.io/northblue/unnamed-island@sha256:925f7e1cd777e9a69bc3e012de04d112dd1b1cd38db3e6cfc2c224cfb75bf169
    platform: linux/amd64
    restart: 'no'
    environment:
      DATABASE_URL: ''
    command: [node, scripts/postgres-cli.mjs, status]
    networks:
      - data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  data:
    external: true
    name: nas-postgres-data
